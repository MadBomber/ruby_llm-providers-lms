plugins:
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.3
  Exclude:
    - Archspec.rb
    - vendor/**/*
    - gemfiles/**/*
  SuggestExtensions: false

Metrics/AbcSize:
  Max: 80
Metrics/MethodLength:
  Max: 40
  CountAsOne:
    - array
    - hash
    - heredoc
Metrics/BlockLength:
  Exclude:
    - spec/**/*.rb
RSpec/ExampleLength:
  Enabled: false
RSpec/MultipleExpectations:
  Enabled: false
# RubyLLM protocol seams (render_payload and friends) are keyword-heavy by
# design; the signature must match the Protocol base class.
Metrics/ParameterLists:
  CountKeywordArgs: false
