<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Roboto, Helvetica, Arial, sans-serif">
  <title>ruby_llm-providers-lms request routing</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa5ce"/>
    </marker>
  </defs>

  <!-- Application / RubyLLM -->
  <rect x="20" y="20" width="920" height="70" rx="10" fill="#1f2335" stroke="#7aa2f7" stroke-width="2"/>
  <text x="480" y="48" text-anchor="middle" fill="#c0caf5" font-size="17" font-weight="bold">Your application + RubyLLM 2.1</text>
  <text x="480" y="72" text-anchor="middle" fill="#a9b1d6" font-size="13">RubyLLM.chat · chat.ask · RubyLLM.embed · RubyLLM.judge / RubyLLM::Judge · provider.list_models · provider.load_model</text>

  <!-- Provider -->
  <rect x="20" y="120" width="920" height="96" rx="10" fill="#1f2335" stroke="#bb9af7" stroke-width="2"/>
  <text x="480" y="146" text-anchor="middle" fill="#c0caf5" font-size="17" font-weight="bold">RubyLLM::Providers::LMS  (provider :lms)</text>
  <text x="480" y="170" text-anchor="middle" fill="#a9b1d6" font-size="13">resolve_protocol: chat → lms_protocol · embed → :chat_completions · judge → lms_judgment_protocol</text>
  <rect x="300" y="182" width="360" height="26" rx="6" fill="#2a1f35" stroke="#f7768e" stroke-width="1.5"/>
  <text x="480" y="200" text-anchor="middle" fill="#f7768e" font-size="13">ConnectionGuard — "start it with lms server start"</text>

  <line x1="480" y1="90" x2="480" y2="118" stroke="#9aa5ce" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Protocol columns -->
  <!-- OpenAI -->
  <rect x="20" y="250" width="300" height="160" rx="10" fill="#16202e" stroke="#7dcfff" stroke-width="2"/>
  <text x="170" y="276" text-anchor="middle" fill="#7dcfff" font-size="15" font-weight="bold">OpenAI API</text>
  <text x="40" y="304" fill="#c0caf5" font-size="13">:chat_completions (default)</text>
  <text x="40" y="324" fill="#c0caf5" font-size="13">:responses</text>
  <text x="40" y="344" fill="#c0caf5" font-size="13">embeddings (always here)</text>
  <text x="40" y="374" fill="#565f89" font-size="12">/v1/chat/completions · /v1/responses</text>
  <text x="40" y="392" fill="#565f89" font-size="12">/v1/embeddings · /v1/models</text>

  <!-- Anthropic -->
  <rect x="330" y="250" width="140" height="160" rx="10" fill="#2a2116" stroke="#ff9e64" stroke-width="2"/>
  <text x="400" y="276" text-anchor="middle" fill="#ff9e64" font-size="15" font-weight="bold">Anthropic</text>
  <text x="345" y="304" fill="#c0caf5" font-size="13">:anthropic</text>
  <text x="345" y="392" fill="#565f89" font-size="12">/v1/messages</text>

  <!-- Native -->
  <rect x="480" y="250" width="220" height="160" rx="10" fill="#1a2a1e" stroke="#9ece6a" stroke-width="2"/>
  <text x="590" y="276" text-anchor="middle" fill="#9ece6a" font-size="15" font-weight="bold">Native REST</text>
  <text x="495" y="304" fill="#c0caf5" font-size="13">:native_v0 (stats)</text>
  <text x="495" y="324" fill="#c0caf5" font-size="13">:native_chat (stateful)</text>
  <text x="495" y="344" fill="#c0caf5" font-size="13">model listing + management</text>
  <text x="495" y="374" fill="#565f89" font-size="12">/api/v0/chat/completions</text>
  <text x="495" y="392" fill="#565f89" font-size="12">/api/v1/chat · /api/v1/models/*</text>

  <!-- Decisions -->
  <rect x="710" y="250" width="230" height="160" rx="10" fill="#2e1a2e" stroke="#e0af68" stroke-width="2"/>
  <text x="825" y="276" text-anchor="middle" fill="#e0af68" font-size="15" font-weight="bold">Decisions</text>
  <text x="725" y="304" fill="#c0caf5" font-size="13">:decisions (default)</text>
  <text x="725" y="324" fill="#c0caf5" font-size="13">:system_one</text>
  <text x="725" y="344" fill="#c0caf5" font-size="13">judgments only</text>
  <text x="725" y="374" fill="#565f89" font-size="12">/v1/decisions</text>
  <text x="725" y="392" fill="#565f89" font-size="12">/v1/systemone</text>

  <line x1="170" y1="216" x2="170" y2="248" stroke="#7dcfff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="216" x2="400" y2="248" stroke="#ff9e64" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="216" x2="590" y2="248" stroke="#9ece6a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="825" y1="216" x2="825" y2="248" stroke="#e0af68" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LM Studio -->
  <rect x="20" y="450" width="920" height="130" rx="10" fill="#1f2335" stroke="#73daca" stroke-width="2"/>
  <rect x="60" y="466" width="380" height="64" rx="8" fill="#16202e" stroke="#7dcfff" stroke-width="1.5"/>
  <text x="250" y="492" text-anchor="middle" fill="#7dcfff" font-size="14" font-weight="bold">Chat + embedding models</text>
  <text x="250" y="514" text-anchor="middle" fill="#a9b1d6" font-size="12">type "llm" / "embedding" · JIT-loaded · TTL · auto-evict</text>
  <rect x="520" y="466" width="380" height="64" rx="8" fill="#2e1a2e" stroke="#e0af68" stroke-width="1.5"/>
  <text x="710" y="492" text-anchor="middle" fill="#e0af68" font-size="14" font-weight="bold">Decision models</text>
  <text x="710" y="514" text-anchor="middle" fill="#a9b1d6" font-size="12">type "decision" · GGUF · optional vision adapter</text>
  <text x="480" y="562" text-anchor="middle" fill="#c0caf5" font-size="17" font-weight="bold">LM Studio server — one port (localhost:1234)</text>

  <line x1="250" y1="410" x2="250" y2="464" stroke="#7dcfff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="410" x2="330" y2="464" stroke="#ff9e64" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="410" x2="420" y2="464" stroke="#9ece6a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="825" y1="410" x2="760" y2="464" stroke="#e0af68" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
