<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Roboto, Helvetica, Arial, sans-serif">
  <title>How a judgment reaches an LM Studio decision model</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa5ce"/>
    </marker>
  </defs>

  <!-- Call -->
  <rect x="230" y="20" width="500" height="74" rx="10" fill="#1f2335" stroke="#7aa2f7" stroke-width="2"/>
  <text x="480" y="48" text-anchor="middle" fill="#c0caf5" font-size="16" font-weight="bold">RubyLLM.judge(input, questions:, with:, model:)</text>
  <text x="480" y="72" text-anchor="middle" fill="#a9b1d6" font-size="13">or TicketTriage.judge(...) — probability · choice · score</text>

  <!-- Resolve -->
  <rect x="230" y="124" width="500" height="74" rx="10" fill="#1f2335" stroke="#bb9af7" stroke-width="2"/>
  <text x="480" y="152" text-anchor="middle" fill="#c0caf5" font-size="16" font-weight="bold">LMS#resolve_protocol(operation: :judge)</text>
  <text x="480" y="176" text-anchor="middle" fill="#a9b1d6" font-size="13">config.lms_judgment_protocol — ignores lms_protocol</text>
  <line x1="480" y1="94" x2="480" y2="122" stroke="#9aa5ce" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decisions -->
  <rect x="40" y="240" width="420" height="160" rx="10" fill="#16202e" stroke="#7dcfff" stroke-width="2"/>
  <text x="250" y="266" text-anchor="middle" fill="#7dcfff" font-size="16" font-weight="bold">:decisions  (default)</text>
  <text x="60" y="292" fill="#c0caf5" font-size="13">POST /v1/decisions — OpenAI's Decisions API</text>
  <text x="60" y="314" fill="#a9b1d6" font-size="12">questions: [ {type: predicate / choice / score, name, ...} ]</text>
  <text x="60" y="334" fill="#a9b1d6" font-size="12">criteria folded into the instruction text</text>
  <text x="60" y="354" fill="#a9b1d6" font-size="12">images: input_image data URLs inside input</text>
  <text x="60" y="380" fill="#9ece6a" font-size="12">answers: array, matched to questions by name</text>

  <!-- System One -->
  <rect x="500" y="240" width="420" height="160" rx="10" fill="#2a2116" stroke="#ff9e64" stroke-width="2"/>
  <text x="710" y="266" text-anchor="middle" fill="#ff9e64" font-size="16" font-weight="bold">:system_one</text>
  <text x="520" y="292" fill="#c0caf5" font-size="13">POST /v1/systemone — Jev System One API</text>
  <text x="520" y="314" fill="#a9b1d6" font-size="12">questions: { name: {type: noul / choice / score, criteria} }</text>
  <text x="520" y="334" fill="#a9b1d6" font-size="12">criteria sent as structured data</text>
  <text x="520" y="354" fill="#a9b1d6" font-size="12">images: top-level images array; state required</text>
  <text x="520" y="380" fill="#9ece6a" font-size="12">answers: hash keyed by question name</text>

  <line x1="400" y1="198" x2="260" y2="238" stroke="#7dcfff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="198" x2="700" y2="238" stroke="#ff9e64" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Model -->
  <rect x="230" y="440" width="500" height="60" rx="10" fill="#2e1a2e" stroke="#e0af68" stroke-width="2"/>
  <text x="480" y="466" text-anchor="middle" fill="#e0af68" font-size="16" font-weight="bold">Decision model (type: "decision")</text>
  <text x="480" y="488" text-anchor="middle" fill="#a9b1d6" font-size="13">kev-0.8b · d1-omni-600m · clef-flash · ... — probabilities, no text</text>
  <line x1="250" y1="400" x2="400" y2="438" stroke="#9aa5ce" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="710" y1="400" x2="560" y2="438" stroke="#9aa5ce" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="480" y="536" text-anchor="middle" fill="#9ece6a" font-size="14">→ RubyLLM::Judgment: Probability · Choice · Score, tokens, model (instance id)</text>
</svg>
